<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ladder Slasher — Prototype</title>
<style>
:root{--bg:#080b12;--panel:#111827;--panel2:#182235;--gold:#f4c95d;--red:#e05252;--green:#63d391;--text:#f4f5f7;--muted:#9ca8ba}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#202d46 0,#080b12 48%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:16px}.title{font-size:clamp(25px,4vw,42px);font-weight:900;letter-spacing:-1px}.sub{color:var(--muted);font-size:13px}.hud{display:flex;gap:9px;flex-wrap:wrap}.pill{background:#101827;border:1px solid #29354b;border-radius:999px;padding:8px 12px;font-size:13px}.ladder{display:flex;gap:8px;overflow:auto;padding:10px 0 16px}.rung{min-width:72px;text-align:center;border:1px solid #2b3850;border-radius:10px;padding:8px;background:#101827;color:#8995a8}.rung.active{border-color:var(--gold);color:#fff;background:#2a2515;box-shadow:0 0 18px #f4c95d25}.arena{display:grid;grid-template-columns:1fr 120px 1fr;gap:16px;align-items:center;background:linear-gradient(145deg,#111827,#0d1420);border:1px solid #27344a;border-radius:20px;padding:22px;box-shadow:0 18px 50px #0007}.fighter{background:#0b111c;border:1px solid #263249;border-radius:18px;padding:14px;text-align:center;position:relative}.name{font-weight:800;margin-bottom:8px}.sprite{height:270px;display:grid;place-items:center}.sprite svg{width:100%;height:100%;max-width:240px;filter:drop-shadow(0 16px 18px #0008)}.hp{height:13px;background:#2a1117;border-radius:999px;overflow:hidden;border:1px solid #43232b}.hp>i{display:block;height:100%;background:linear-gradient(90deg,#a82d3b,#ef6a61);width:100%;transition:.35s}.hero .hp>i{background:linear-gradient(90deg,#277c55,#63d391)}.stats{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:7px}.vs{font-size:32px;font-weight:1000;text-align:center;color:var(--gold);text-shadow:0 0 20px #f4c95d66}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:900;cursor:pointer;color:#10131a;background:var(--gold);box-shadow:0 8px 20px #0005}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.secondary{background:#263249;color:#fff}.log{min-height:46px;text-align:center;color:#b8c1d0;font-size:14px;padding:7px}.loot{display:none;background:linear-gradient(145deg,#171b27,#0e1320);border:1px solid #705d27;border-radius:20px;padding:22px;margin-top:16px}.loot.show{display:block;animation:pop .45s ease}.loot h2{margin:0 0 12px;color:var(--gold)}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.item{background:#111827;border:1px solid #303c52;border-radius:14px;padding:13px;display:flex;gap:12px;align-items:center}.itemicon{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;background:#242c3b;font-size:30px}.item b{display:block}.rarity{font-size:11px;color:var(--gold);margin-top:4px}.restart{margin-top:14px}.tip{text-align:center;color:#6f7c90;font-size:12px;margin-top:14px}@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}@media(max-width:760px){.arena{grid-template-columns:1fr;}.vs{font-size:22px}.sprite{height:210px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="title">⚔️ Ladder Slasher</div><div class="sub">Suba a escada, derrote os monstros e veja o loot.</div></div><div class="hud"><div class="pill">Nível <b id="level">1</b>/10</div><div class="pill">❤️ <b id="playerHpText">100</b></div><div class="pill">⚔️ <b id="powerText">18</b></div></div></div>
  <div class="ladder" id="ladder"></div>
  <section class="arena">
    <div class="fighter hero"><div class="name">Kael, o Andarilho</div><div class="sprite"><svg viewBox="0 0 220 280" aria-label="Imagem do personagem"><circle cx="110" cy="62" r="34" fill="#d89b75"/><path d="M75 60Q110 10 145 60Q132 39 110 39Q88 39 75 60" fill="#33231f"/><path d="M78 105Q110 87 142 105L160 225Q110 260 60 225Z" fill="#354b72"/><path d="M82 117L35 205 52 214 99 140M138 117L188 205 171 214 121 140" fill="#253a5c"/><path d="M78 105L48 154 70 169 99 125M142 105L172 154 150 169 121 125" fill="#c7d2e5"/><path d="M93 225L75 270 95 270 110 235 125 270 145 270 127 225" fill="#202838"/><circle cx="98" cy="65" r="4" fill="#1b1620"/><circle cx="122" cy="65" r="4" fill="#1b1620"/><path d="M100 79Q110 86 120 79" fill="none" stroke="#7b403a" stroke-width="3"/></svg></div><div class="hp"><i id="heroBar"></i></div><div class="stats"><span>Vida</span><span id="heroHp">100 / 100</span></div></div>
    <div class="vs">VS</div>
    <div class="fighter"><div class="name" id="monsterName">Goblin da Escada</div><div class="sprite"><svg viewBox="0 0 220 280" aria-label="Imagem do monstro"><path d="M110 32L72 75 80 113 110 96 140 113 148 75Z" fill="#526d39"/><circle cx="110" cy="96" r="55" fill="#668b43"/><path d="M62 94L36 68 43 125 70 117M158 94L184 68 177 125 150 117" fill="#4f6b34"/><path d="M68 150Q110 180 152 150L160 225Q110 250 60 225Z" fill="#3c4934"/><circle cx="91" cy="94" r="7" fill="#f4c95d"/><circle cx="129" cy="94" r="7" fill="#f4c95d"/><path d="M88 126Q110 142 132 126" fill="none" stroke="#2a2220" stroke-width="6"/><path d="M83 217L68 266 90 266 110 226 130 266 152 266 137 217" fill="#242a22"/><path d="M82 174L44 209 55 222 99 193M138 174L176 209 165 222 121 193" fill="#4d5d45"/></svg></div><div class="hp"><i id="monsterBar"></i></div><div class="stats"><span>Vida</span><span id="monsterHp">65 / 65</span></div></div>
  </section>
  <div class="controls"><button class="btn" id="attack">⚔️ Atacar</button><button class="btn secondary" id="skill">🔥 Golpe forte</button><button class="btn secondary" id="heal">🧪 Poção</button></div>
  <div class="log" id="log">Você encontrou um monstro. Escolha uma ação.</div>
  <section class="loot" id="loot"><h2>🏆 Vitória! Loot encontrado</h2><div class="items" id="items"></div><button class="btn restart" id="next">➡️ Subir para o próximo degrau</button></section>
  <div class="tip">Protótipo jogável • combate por turnos • 10 degraus • loot aleatório</div>
</div>
<script>
const monsters=[['Goblin da Escada',65,10],['Lobo Sombrio',82,13],['Orc Saqueador',105,16],['Aranha Colossal',125,19],['Cavaleiro Caído',150,22],['Golem de Pedra',180,25],['Bruxa do Abismo',205,28],['Demônio Rubro',235,32],['Guardião Antigo',270,36],['Rei da Escada',330,42]];
const loot=[['🗡️','Lâmina Serrilhada','Dano +6','Raro'],['🛡️','Escudo do Guardião','Vida +25','Incomum'],['💍','Anel do Caçador','Crítico +8%','Épico'],['🧪','Poção Maior','Cura +40','Comum'],['👢','Botas da Escada','Esquiva +5%','Raro'],['💎','Cristal Sombrio','Poder +12','Lendário']];
let level=1,php=100,power=18,mhp=65,maxM=65,locked=false;
const $=id=>document.getElementById(id);
function renderLadder(){ $('ladder').innerHTML=monsters.map((m,i)=>`<div class="rung ${i+1===level?'active':''}">⚔️<br><b>${i+1}</b></div>`).join('') }
function setBars(){ $('heroBar').style.width=php+'%'; $('monsterBar').style.width=Math.max(0,mhp/maxM*100)+'%'; $('heroHp').textContent=`${php} / 100`; $('monsterHp').textContent=`${Math.max(0,mhp)} / ${maxM}`; $('playerHpText').textContent=php; $('powerText').textContent=power }
function start(){ const m=monsters[level-1]; $('monsterName').textContent=m[0]; maxM=m[1]; mhp=maxM; locked=false; $('loot').classList.remove('show'); $('log').textContent=`${m[0]} apareceu!`; renderLadder(); setBars(); buttons(true) }
function buttons(on){$('attack').disabled=!on;$('skill').disabled=!on;$('heal').disabled=!on}
function enemyTurn(){ if(mhp<=0)return; const dmg=Math.max(3,monsters[level-1][2]+Math.floor(Math.random()*7)-3); php=Math.max(0,php-dmg); $('log').textContent+=` O monstro contra-atacou e causou ${dmg} de dano.`; setBars(); if(php<=0){locked=true;buttons(false);$('log').textContent='Você caiu! Use Reiniciar para tentar novamente.';$('next').textContent='🔄 Tentar novamente';$('loot').classList.add('show');$('items').innerHTML='<div class="item"><div class="itemicon">💀</div><div><b>Derrota</b><span class="rarity">O degrau venceu desta vez.</span></div></div>';}}
function attack(dmg,label){ if(locked)return; mhp=Math.max(0,mhp-dmg); $('log').textContent=`${label}: você causou ${dmg} de dano.`;setBars();if(mhp<=0)win();else setTimeout(enemyTurn,420) }
function win(){locked=true;buttons(false);$('log').textContent=`Você derrotou ${monsters[level-1][0]}! O baú revelou possíveis recompensas.`;const picks=[...loot].sort(()=>Math.random()-.5).slice(0,3);$('items').innerHTML=picks.map(x=>`<div class="item"><div class="itemicon">${x[0]}</div><div><b>${x[1]}</b><div>${x[2]}</div><div class="rarity">${x[3]}</div></div></div>`).join('');$('next').textContent=level<10?'➡️ Subir para o próximo degrau':'🏆 Recomeçar a escada';$('loot').classList.add('show')}
$('attack').onclick=()=>attack(power+Math.floor(Math.random()*7),'Ataque');$('skill').onclick=()=>attack(power+10+Math.floor(Math.random()*9),'Golpe forte');$('heal').onclick=()=>{if(locked)return;php=Math.min(100,php+30);$('log').textContent='Você bebeu uma poção e recuperou 30 de vida.';setBars();setTimeout(enemyTurn,420)};
$('next').onclick=()=>{if(php<=0||level>=10){level=1;php=100;power=18;start();}else{level++;power+=2;start()}};start();
</script>
</body></html>
