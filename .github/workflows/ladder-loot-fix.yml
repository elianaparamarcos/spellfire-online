name: Ladder Slasher V0.4 loot fix
on:
  push:
    paths:
      - '.github/workflows/ladder-loot-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch loot and version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/ladder-slasher/index.html')
          s=p.read_text(encoding='utf-8')
          old="""<div class=\"title\">⚔️ Ladder Slasher</div>"""
          new="""<div class=\"title\">⚔️ Ladder Slasher — V0.4</div>"""
          if old in s:
              s=s.replace(old,new,1)
          old_fn="""function collectLoot(i){let x=loot[i];if(!x||x.taken)return;x.taken=true;if(x.potion){s.pots++;log(`${x.i} ${x.n} entrou no inventário como poção.`)}else{s.inventory.push(x);log(`${x.i} ${x.n} foi coletado. Agora está no inventário.`)}renderLoot();render()}"""
          new_fn="""function collectLoot(i){const x=loot[i];if(!x||x.taken)return;x.taken=true;const card=$('lootGrid').children[i];if(card){card.classList.add('collected');card.onclick=null}if(x.potion){s.pots++;log(`${x.i} ${x.n} entrou no inventário como poção.`)}else{s.inventory.push(x);log(`${x.i} ${x.n} foi coletado. Agora está no inventário.`)}render()}"""
          if old_fn in s:
              s=s.replace(old_fn,new_fn,1)
          else:
              raise SystemExit('loot function pattern not found')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ladder-slasher/index.html
          git diff --cached --quiet || git commit -m 'Ladder Slasher V0.4: fix collecting multiple loot items'
          git push
